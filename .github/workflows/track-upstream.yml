name: track-upstream

on:
  schedule:
    # Daily at 03:17 UTC.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Explicit upstream tag (overrides release lookup)"
        type: string
        required: false
      force:
        description: "Build even when the tag is not newer than kernel/UPSTREAM_TAG"
        type: boolean
        default: false

# Least privilege by default. Jobs opt in to the write scopes they need.
permissions:
  contents: read

concurrency:
  group: track-upstream
  cancel-in-progress: false

env:
  NDK_VERSION: "27.0.12077973"

jobs:
  check:
    name: Resolve upstream tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      should_build: ${{ steps.resolve.outputs.should_build }}
      current: ${{ steps.resolve.outputs.current }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_TAG}" ]]; then
            tag="${INPUT_TAG}"
            tag_re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
            if [[ ! "${tag}" =~ ${tag_re} ]]; then
              echo "::error::Upstream tag failed validation: ${tag}"
              exit 1
            fi
          else
            # EasyTier publishes almost every release as a GitHub prerelease and
            # keeps an old one flagged stable, so `releases/latest` is stale.
            # Take the highest version among all published releases instead.
            tag="$(gh api 'repos/EasyTier/EasyTier/releases?per_page=100' \
              --jq '.[] | select(.draft | not) | .tag_name' \
              | python3 scripts/semver.py max)"
            if [[ -z "${tag}" ]]; then
              echo "::error::Could not resolve an upstream release tag"
              exit 1
            fi
            # The same guard applies: never move to a version we already have.
            if [[ "${tag}" != "" && ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::Upstream tag failed validation: ${tag}"
              exit 1
            fi
          fi
          current="$(tr -d '[:space:]' < kernel/UPSTREAM_TAG || true)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          if [[ "${FORCE}" == "true" ]]; then
            echo "Building ${tag} because force was requested."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [[ -z "${current}" ]] || python3 scripts/semver.py gt "${tag}" "${current}"; then
            echo "Building ${tag} (current pin: ${current:-none})."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream ${tag} is not newer than the pinned ${current}; nothing to do."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ needs.check.outputs.tag }}
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1, toolchain 1.95
        with:
          toolchain: "1.95"
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2
        with:
          tool: cargo-ndk

      - name: Install protoc
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler
          protoc --version

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kernel/src/target
          key: kernel-${{ runner.os }}-${{ needs.check.outputs.tag }}-${{ hashFiles('scripts/build-kernel.sh') }}
          restore-keys: |
            kernel-${{ runner.os }}-${{ needs.check.outputs.tag }}-

      - name: Install Android NDK r27
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          yes | "${SDK}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${SDK}/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${SDK}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # build-kernel.sh applies kernel/patches/*.patch in filename order on a
      # best-effort basis: only patches that pass `git apply --check` are
      # applied. Failures are recorded in kernel/out/PATCH_STATUS.txt and do not
      # fail this job, so the PR below still opens for manual rebase. The PR is
      # marked "do not merge" and the app's release build refuses to run with a
      # failed patch.
      - name: Build all ABIs
        env:
          TAG: ${{ needs.check.outputs.tag }}
          EASYTIER_PROXY: ""
          EASYTIER_LOCAL_SRC: ""
        run: |
          set -euo pipefail
          chmod +x scripts/build-kernel.sh
          ./scripts/build-kernel.sh \
            --tag "${TAG}" \
            --abis "arm64-v8a,x86_64" \
            --no-jni-libs

      - name: Read patch status
        id: patches
        run: |
          set -euo pipefail
          status_file="kernel/out/PATCH_STATUS.txt"
          applied=""
          failed=""
          if [[ -f "${status_file}" ]]; then
            applied="$(awk -F': ' '$2 == "APPLIED" {print $1}' "${status_file}" | paste -sd ',' - | sed 's/,/, /g')"
            failed="$(awk -F': ' '$2 == "FAILED" {print $1}' "${status_file}" | paste -sd ',' - | sed 's/,/, /g')"
          fi
          echo "applied=${applied}" >> "$GITHUB_OUTPUT"
          echo "failed=${failed}" >> "$GITHUB_OUTPUT"
          if [[ -n "${failed}" ]]; then
            echo "::warning title=Patch needs rebase::${failed}"
          else
            echo "All kernel patches applied."
          fi

      - name: Compute PR title
        id: pr_title
        env:
          FAILED: ${{ steps.patches.outputs.failed }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "${FAILED}" ]]; then
            echo "title=kernel: update EasyTier to ${TAG} [patch needs rebase]" >> "$GITHUB_OUTPUT"
          else
            echo "title=kernel: update EasyTier to ${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke check exports and 16 KB LOAD alignment
        run: |
          set -euo pipefail
          python3 scripts/check-elf.py --summary\
            kernel/out/arm64-v8a/libeasytier_android_jni.so\
            kernel/out/x86_64/libeasytier_android_jni.so

      - name: Stage version bump
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail
          printf '%s\n' "${TAG}" > kernel/UPSTREAM_TAG

      - name: Upload built libraries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: easytier-kernel-${{ needs.check.outputs.tag }}
          path: |
            kernel/out/**/*.so
            kernel/out/PATCH_STATUS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Ensure do-not-merge label exists
        if: steps.patches.outputs.failed != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh label create "do not merge" \
            --color "B60205" \
            --description "Automated kernel PR with a failed patch; needs manual rebase" \
            --force

      - name: Open or update patch rebase issue
        if: steps.patches.outputs.failed != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED: ${{ steps.patches.outputs.failed }}
          TAG: ${{ needs.check.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="kernel: rebase kernel patch(es) for ${TAG}"
          body="$(printf 'Patch(es) failed to apply to upstream %s:\n\n%s\n\nThe build continued without them. Rebase the patches in kernel/patches/ and verify, then close this issue.\nWorkflow run: %s\n' "${TAG}" "${FAILED}" "${RUN_URL}")"
          existing="$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -1)"
          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi

      - name: Prepare pull request body
        id: pr_body
        env:
          TAG: ${{ needs.check.outputs.tag }}
          CURRENT: ${{ needs.check.outputs.current }}
          APPLIED: ${{ steps.patches.outputs.applied }}
          FAILED: ${{ steps.patches.outputs.failed }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/pr-body.md"
          if [[ -n "${FAILED}" ]]; then
            {
              printf '> [!WARNING]\n'
              printf '> **DO NOT MERGE.** These kernel patches failed to apply: `%s`.\n' "${FAILED}"
              printf '> The build continued without them, so this kernel can write\n'
              printf '> `network_secret` to logcat. Rebase the patches in `kernel/patches/`,\n'
              printf '> re-run the workflow, and merge only after every patch is APPLIED\n'
              printf '> and the PR label is removed.\n\n'
            } > "${body}"
          else
            : > "${body}"
          fi
          {
            printf 'Automated tracking of the upstream EasyTier stable release.\n\n'
            printf -- '- Previous tag: `%s`\n' "${CURRENT}"
            printf -- '- New tag: `%s`\n' "${TAG}"
            printf -- '- ABIs built: arm64-v8a, x86_64\n'
            printf -- '- Patches applied: `%s`\n' "${APPLIED}"
            printf -- '- Patches needing rebase: `%s`\n' "${FAILED}"
            printf -- '- Smoke check passed: `Java_com_easytier_jni_EasyTierJNI_runNetworkInstance` exported\n'
            printf -- '- 16 KB page alignment verified: every LOAD segment reports `Align 0x4000`\n\n'
            printf 'Build artifacts are attached to this workflow run. Review `kernel/README.md`\n'
            printf 'for the patch policy.\n'
          } >> "${body}"
          echo "path=${body}" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: kernel/upstream-${{ needs.check.outputs.tag }}
          base: main
          add-paths: kernel/UPSTREAM_TAG
          delete-branch: true
          title: ${{ steps.pr_title.outputs.title }}
          commit-message: "kernel: update EasyTier to ${{ needs.check.outputs.tag }}"
          body-path: ${{ steps.pr_body.outputs.path }}

      - name: Mark PR do not merge
        if: steps.patches.outputs.failed != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          if [[ -z "${PR_NUMBER}" ]]; then
            echo "::error::Expected a pull request number after create-pull-request"
            exit 1
          fi
          gh pr edit "${PR_NUMBER}" --add-label "do not merge"
